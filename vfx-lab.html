<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>霧界繪行者 VFX Lab</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#06090c;color:#eee;font-family:system-ui}canvas{display:block}#ui{position:fixed;z-index:5;top:12px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.box{background:#071217dc;border:1px solid #35515a;border-radius:12px;padding:8px 10px;font-size:12px}.box b{color:#e8c96d}button{border:1px solid #557173;background:#132a2e;color:#eef2eb;border-radius:9px;padding:9px 12px;font-weight:800}button.primary{background:#d4b656;color:#182021}.hint{position:fixed;z-index:4;left:12px;bottom:12px;right:12px;background:#050b0dcc;border:1px solid #2c4144;border-radius:10px;padding:8px 10px;font-size:11px;color:#aebfba}</style></head><body><div id="ui"><div class="box"><b>Three.js VFX Lab</b><br><span id="backend">checking renderer…</span></div><button class="primary" id="frost">冰脈直線</button><button id="storm">雷鏈直線</button><button id="zone">裂鳴法陣</button><button id="clear">清除</button></div><div class="hint">這是戰鬥「爆發層」原型，不是要把世界地圖改成 3D。滑鼠／觸控移動可以改變瞄準方向；點技能按鈕施放。</div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x061014);scene.fog=new THREE.FogExp2(0x061014,.035);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.set(0,11,15);camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
document.getElementById('backend').textContent=(navigator.gpu?'WebGPU available ・ ':'')+'WebGL2 runtime fallback';
scene.add(new THREE.HemisphereLight(0xb9ddea,0x172015,1.3));const sun=new THREE.DirectionalLight(0xffe8bd,2.2);sun.position.set(4,10,6);scene.add(sun);
const floor=new THREE.Mesh(new THREE.CircleGeometry(14,64),new THREE.MeshStandardMaterial({color:0x27332f,roughness:.95,metalness:.02}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const grid=new THREE.GridHelper(22,22,0x526b66,0x263b38);grid.position.y=.01;scene.add(grid);
const caster=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.9,4,10),new THREE.MeshStandardMaterial({color:0x3f657a,roughness:.7}));body.position.y=.9;caster.add(body);const sigil=new THREE.Mesh(new THREE.TorusGeometry(.7,.045,8,48),new THREE.MeshBasicMaterial({color:0xe4c764}));sigil.rotation.x=Math.PI/2;sigil.position.y=.04;caster.add(sigil);caster.position.set(-5,0,0);scene.add(caster);
let aim=new THREE.Vector3(1,0,0),active=[];const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0),hit=new THREE.Vector3();
const arrow=new THREE.Group();const line=new THREE.Mesh(new THREE.BoxGeometry(5,.035,.18),new THREE.MeshBasicMaterial({color:0x83d8d2,transparent:true,opacity:.65}));line.position.x=2.5;arrow.add(line);const head=new THREE.Mesh(new THREE.ConeGeometry(.35,.75,3),line.material);head.rotation.z=-Math.PI/2;head.position.x=5.3;arrow.add(head);arrow.position.copy(caster.position);arrow.position.y=.08;scene.add(arrow);
function setAim(ev){let x=ev.clientX??ev.touches?.[0]?.clientX,y=ev.clientY??ev.touches?.[0]?.clientY;if(x==null)return;pointer.x=x/innerWidth*2-1;pointer.y=-(y/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);if(raycaster.ray.intersectPlane(plane,hit)){aim.copy(hit).sub(caster.position);aim.y=0;if(aim.lengthSq()>.01)aim.normalize();arrow.rotation.y=-Math.atan2(aim.z,aim.x)}}addEventListener('pointermove',setAim);addEventListener('touchmove',setAim,{passive:true});
function track(o,life=1.4){scene.add(o);active.push({o,t:0,life});return o}function clearAll(){for(const a of active)scene.remove(a.o);active=[]}
function frost(){const g=new THREE.Group(),dir=aim.clone(),side=new THREE.Vector3(-dir.z,0,dir.x);for(let i=0;i<26;i++){let t=(i+1)/26,spread=(Math.random()-.5)*(0.35+1.1*t),h=.35+2.2*t*Math.random();const m=new THREE.Mesh(new THREE.ConeGeometry(.12+.14*t,h,5),new THREE.MeshPhysicalMaterial({color:0x8dd8e8,roughness:.14,metalness:.05,transmission:.15,emissive:0x163c55,emissiveIntensity:1.1,transparent:true,opacity:.92}));m.position.copy(caster.position).add(dir.clone().multiplyScalar(t*10)).add(side.clone().multiplyScalar(spread));m.position.y=h/2;m.rotation.z=(Math.random()-.5)*.35;g.add(m)}track(g,2.3)}
function storm(){const g=new THREE.Group();for(let strand=0;strand<5;strand++){const pts=[];for(let i=0;i<20;i++){let t=i/19,p=caster.position.clone().add(aim.clone().multiplyScalar(t*10));p.y=.18+Math.sin(t*Math.PI)*(.4+strand*.07);p.x+=(Math.random()-.5)*.16;p.z+=(Math.random()-.5)*.38;pts.push(p)}const geo=new THREE.BufferGeometry().setFromPoints(pts);const ln=new THREE.Line(geo,new THREE.LineBasicMaterial({color:strand%2?0xd8efff:0x7fbfff,transparent:true,opacity:.85}));g.add(ln)}const light=new THREE.PointLight(0x79bfff,8,7);light.position.copy(caster.position).add(aim.clone().multiplyScalar(8));light.position.y=1;g.add(light);track(g,.9)}
function zone(){const center=caster.position.clone().add(aim.clone().multiplyScalar(7));const g=new THREE.Group();g.position.copy(center);const ring=new THREE.Mesh(new THREE.RingGeometry(2.5,2.68,80),new THREE.MeshBasicMaterial({color:0xb58cff,side:THREE.DoubleSide,transparent:true,opacity:.8}));ring.rotation.x=-Math.PI/2;ring.position.y=.03;g.add(ring);for(let i=0;i<14;i++){let a=i/14*Math.PI*2;const p=new THREE.Mesh(new THREE.ConeGeometry(.08,.8,5),new THREE.MeshBasicMaterial({color:0xd7b8ff,transparent:true,opacity:.85}));p.position.set(Math.cos(a)*2.2,.4,Math.sin(a)*2.2);p.rotation.z=(Math.random()-.5)*.5;g.add(p)}const column=new THREE.Mesh(new THREE.CylinderGeometry(.35,1.4,4,24,1,true),new THREE.MeshBasicMaterial({color:0x8564e8,transparent:true,opacity:.18,side:THREE.DoubleSide,blending:THREE.AdditiveBlending}));column.position.y=2;g.add(column);track(g,2.1)}
document.getElementById('frost').onclick=frost;document.getElementById('storm').onclick=storm;document.getElementById('zone').onclick=zone;document.getElementById('clear').onclick=clearAll;
const clock=new THREE.Clock();function animate(){let dt=Math.min(clock.getDelta(),.05);sigil.rotation.z+=dt*.8;for(let i=active.length-1;i>=0;i--){let a=active[i];a.t+=dt;let p=a.t/a.life;a.o.scale.setScalar(p<.12?THREE.MathUtils.lerp(.2,1,p/.12):1);a.o.traverse(c=>{if(c.material&&'opacity'in c.material)c.material.opacity=Math.max(0,(c.material.userData.base??(c.material.userData.base=c.material.opacity))*(1-Math.max(0,p-.65)/.35))});if(a.t>=a.life){scene.remove(a.o);active.splice(i,1)}}renderer.render(scene,camera);requestAnimationFrame(animate)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})
</script></body></html>
