<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#071416"><title>霧界繪行者 v0.4 Roguelike Prototype</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03090a;color:#f2efdf;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.app{height:100dvh;display:flex;flex-direction:column;background:#071416}.top{height:64px;display:flex;align-items:center;padding:8px 10px calc(8px + env(safe-area-inset-top));gap:8px;background:#081a1d;border-bottom:1px solid #294348}.logo{width:34px;height:34px;border:1px solid #917b4d;border-radius:50%;display:grid;place-items:center;color:#e9c66b}.title{font-weight:900;letter-spacing:.08em}.sub{font-size:9px;color:#92aaa3}.stats{margin-left:auto;display:flex;gap:5px}.stat{font-size:8px;color:#9fb4ae;border:1px solid #304d51;border-radius:9px;padding:4px 6px;text-align:center;min-width:45px}.stat b{display:block;color:#e9c66b;font-size:14px}.stage{position:relative;flex:1;overflow:hidden}.stage canvas{width:100%;height:100%;display:block;image-rendering:pixelated;background:#142421}.hud{position:absolute;z-index:4;left:8px;top:8px;right:8px;display:flex;justify-content:space-between;gap:7px;pointer-events:none}.tag{background:#061214dc;border:1px solid #355458;border-radius:8px;padding:6px 8px;font-size:9px;color:#c5d2cd}.tag b{color:#e9c66b}.pressure{position:absolute;z-index:5;left:10px;right:10px;top:48px;height:14px;background:#091417de;border:1px solid #375256;border-radius:9px;overflow:hidden}.pressure i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6db19a,#e4c468,#be5a4e);transition:.2s}.pressure span{position:absolute;inset:0;text-align:center;font-size:8px;line-height:12px;color:#f5f2e5}.interact{position:absolute;z-index:7;left:50%;bottom:112px;transform:translateX(-50%);display:none;padding:10px 15px;border:1px solid #d6bb70;border-radius:12px;background:linear-gradient(#efd173,#c2a34f);color:#172020;font-weight:900}.interact.show{display:block}.controls{position:absolute;z-index:6;left:0;right:0;bottom:0;height:105px;display:flex;justify-content:space-between;align-items:end;padding:9px 12px calc(9px + env(safe-area-inset-bottom));pointer-events:none}.pad,.buttons{position:relative;width:108px;height:88px;pointer-events:auto}.pad button,.buttons button{position:absolute;border:1px solid #667a75;background:#081719e8;color:#eef1e6;font-weight:900;box-shadow:0 4px 12px #0009}.pad button{width:39px;height:36px;border-radius:10px}.pad .u{left:34px;top:0}.pad .d{left:34px;bottom:0}.pad .l{left:0;top:26px}.pad .r{right:0;top:26px}.buttons .a{width:52px;height:52px;right:0;top:0;border-radius:50%;border-color:#8fbd9f}.buttons .x{width:48px;height:34px;left:0;bottom:2px;border-radius:9px}.modal{position:absolute;inset:0;z-index:20;background:#010607dd;display:none;align-items:center;justify-content:center;padding:14px}.modal.show{display:flex}.panel{width:min(94vw,540px);max-height:84vh;overflow:auto;background:linear-gradient(#10292c,#081719);border:1px solid #496267;border-radius:15px;padding:15px;box-shadow:0 18px 50px #000e}.panel h2{margin:0 0 7px}.panel h3{margin:12px 0 5px;color:#e9c66b}.panel p,.panel li{font-size:12px;color:#b5c8c1;line-height:1.55}.card{border:1px solid #4b5d58;border-radius:11px;background:#0c1b1c;padding:10px;margin:8px 0}.card strong{color:#e9c66b}.choices{display:grid;grid-template-columns:1fr;gap:8px}.choices button,.panel>button{border:1px solid #526a65;background:#173235;color:#f2efdf;border-radius:10px;padding:10px;font-weight:800;text-align:left}.choices button b{display:block;color:#e9c66b}.primary{background:linear-gradient(#efd173,#c4a451)!important;color:#172020!important}.danger{border-color:#98554d!important;color:#f0aaa1!important}.toast{position:absolute;z-index:30;left:50%;top:42%;transform:translate(-50%,-50%);opacity:0;background:#071416ef;border:1px solid #6f8f84;border-radius:11px;padding:9px 13px;font-weight:900;transition:.2s;white-space:nowrap}.toast.show{opacity:1;top:38%}.fade{position:absolute;inset:0;z-index:25;background:#000;opacity:0;pointer-events:none;transition:.2s}.fade.on{opacity:1}.legend{position:absolute;z-index:4;left:9px;bottom:110px;font-size:8px;color:#aec0ba;background:#051012cc;border:1px solid #32484a;border-radius:8px;padding:5px 7px;pointer-events:none}.relics{position:absolute;z-index:4;right:9px;bottom:110px;max-width:48%;font-size:8px;color:#d6d9c7;background:#051012cc;border:1px solid #5f563b;border-radius:8px;padding:5px 7px;pointer-events:none}@media(min-width:800px){.app{max-width:1050px;margin:auto;border-left:1px solid #234;border-right:1px solid #234}.controls{opacity:.5}}
</style></head><body><div class="app"><header class="top"><div class="logo">⌁</div><div><div class="title">霧界繪行者</div><div class="sub">v0.4 ・ Seeded Expedition</div></div><div class="stats"><div class="stat">種子<b id="seed">—</b></div><div class="stat">殘圖<b id="maps">0</b></div><div class="stat">戰利<b id="loot">0</b></div></div></header><main class="stage"><canvas id="game"></canvas><div class="hud"><div class="tag" id="area"><b>霧港島</b><br>回音洞入口</div><div class="tag" id="goal"><b>目標</b><br>深入並帶回測繪片</div></div><div class="pressure"><i id="pressureBar"></i><span id="pressureText">共鳴不穩定 0%</span></div><button class="interact" id="interact">調查</button><div class="legend">黃：目標　青：事件　紅：危險　綠：出口</div><div class="relics" id="relics">遺物：無</div><div class="controls"><div class="pad"><button class="u" data-d="u">▲</button><button class="d" data-d="d">▼</button><button class="l" data-d="l">◀</button><button class="r" data-d="r">▶</button></div><div class="buttons"><button class="a" id="act">A</button><button class="x" id="bag">行囊</button></div></div><div class="modal" id="modal"><div class="panel" id="panel"></div></div><div class="toast" id="toast"></div><div class="fade" id="fade"></div></main></div><script>
(()=>{'use strict';
const C=document.getElementById('game'),X=C.getContext('2d'),T=28,$=id=>document.getElementById(id);X.imageSmoothingEnabled=false;
let META=JSON.parse(localStorage.getItem('mw04meta')||'null')||{maps:0,knowledge:0,bestDepth:0};let run=null,M=[],O=[],P={x:3,y:8},near=null,cam={x:0,y:0},timer;
const saveMeta=()=>localStorage.setItem('mw04meta',JSON.stringify(META));const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function newRun(seed=(Date.now()%100000)|0){let R=rng(seed);run={seed,depth:1,pressure:0,loot:0,mapFound:false,relics:[],steps:0,events:{},r:R};generate();P={x:3,y:8};sync();toast('遠征開始・種子 '+seed)}
function generate(){const W=44,H=24,R=run.r;M=Array.from({length:H},()=>Array(W).fill('wall'));O=[];const rooms=[];let x=2,y=5;for(let i=0;i<6;i++){let w=5+Math.floor(R()*4),h=5+Math.floor(R()*4);if(x+w>40){x=3;y+=8}if(y+h>21)break;rooms.push({x,y,w,h,i});for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)M[yy][xx]='floor';if(i>0){let a=rooms[i-1],ax=Math.floor(a.x+a.w/2),ay=Math.floor(a.y+a.h/2),bx=Math.floor(x+w/2),by=Math.floor(y+h/2);while(ax!==bx){M[ay][ax]='floor';ax+=Math.sign(bx-ax)}while(ay!==by){M[ay][ax]='floor';ay+=Math.sign(by-ay)}M[ay][ax]='floor'}x+=w+3+Math.floor(R()*3)}
if(!rooms.length)return;let entry=rooms[0],last=rooms[rooms.length-1];O.push({t:'exit',x:entry.x+1,y:entry.y+Math.floor(entry.h/2),a:'extract',n:'遠征出口'});O.push({t:'cache',x:last.x+last.w-2,y:last.y+Math.floor(last.h/2),a:'map',n:'失落測繪匣'});rooms.slice(1,-1).forEach((rm,i)=>{let px=rm.x+1+Math.floor(R()*(rm.w-2)),py=rm.y+1+Math.floor(R()*(rm.h-2));let roll=R();if(roll<.34)O.push({t:'event',x:px,y:py,a:'event',id:'e'+i,n:'共鳴異象'});else if(roll<.66)O.push({t:'relic',x:px,y:py,a:'relic',id:'r'+i,n:'遺物台'});else O.push({t:'hazard',x:px,y:py,a:'hazard',id:'h'+i,n:'裂鳴區'});});for(let yy=1;yy<H-1;yy++)for(let xx=1;xx<W-1;xx++)if(M[yy][xx]==='floor'&&R()<.05&&!O.some(o=>o.x===xx&&o.y===yy))O.push({t:'crystal',x:xx,y:yy,s:1});
}
function walk(x,y){if(!M[y]||M[y][x]!=='floor')return false;if(O.some(o=>o.s&&o.x===x&&o.y===y)&&!run.relics.includes('phase'))return false;return true}
function move(dx,dy){let nx=P.x+dx,ny=P.y+dy;if(walk(nx,ny)){P.x=nx;P.y=ny;run.steps++;run.pressure=Math.min(100,run.pressure+1+(run.steps%9===0?3:0));if(run.pressure>=100){collapse();return}if(run.pressure>=70&&run.steps%6===0)toast('洞窟正在失穩…');check();sync()}}
function check(){near=null;for(const o of O)if(o.a&&Math.abs(o.x-P.x)+Math.abs(o.y-P.y)<=1&&!run.events[o.id||o.a+o.x+','+o.y]){near=o;break}$('interact').classList.toggle('show',!!near);$('interact').textContent=near?'調查・'+near.n:'調查'}
function action(){if(!near){toast('附近沒有可互動目標');return}const o=near;if(o.a==='extract')return extract();if(o.a==='map')return mapCache(o);if(o.a==='relic')return relicChoice(o);if(o.a==='event')return eventChoice(o);if(o.a==='hazard')return hazard(o)}
function mark(o){run.events[o.id||o.a+o.x+','+o.y]=1;near=null;check()}
function mapCache(o){if(run.mapFound){toast('測繪匣已空');return}run.mapFound=true;run.loot+=2;run.pressure=Math.min(100,run.pressure+10);mark(o);panel('<h2>失落測繪匣</h2><p>你得到一張能讓世界地形重新出現的殘圖，但取走匣子也讓晶洞共鳴變得更不穩。</p><div class="card"><strong>攜帶中：潮痕海岸殘圖</strong><br>成功撤離才會永久保存。</div><button class="primary" onclick="closeM()">開始撤離</button>')}
function relicChoice(o){const pool=[['bridge','折疊橋板','可跨越一次裂縫，之後將加入戰術架橋。'],['phase','鳴晶相位釘','可穿過晶簇阻擋格，但每次穿越 +2% 不穩定。'],['lamp','蛾火燈','事件獎勵提高，但危險事件也更猛烈。'],['bell','裂鳴鐘','可將一次共鳴壓力降低 20%，本次遠征一次。']];let R=run.r,a=pool[Math.floor(R()*pool.length)],b=pool[Math.floor(R()*pool.length)];while(b[0]===a[0])b=pool[Math.floor(R()*pool.length)];panel(`<h2>遺物台</h2><p>只能帶走一件。這不是稀有度選擇，而是決定本次遠征的玩法。</p><div class="choices"><button onclick="pickRelic('${a[0]}','${a[1]}')"><b>${a[1]}</b>${a[2]}</button><button onclick="pickRelic('${b[0]}','${b[1]}')"><b>${b[1]}</b>${b[2]}</button></div>`);window._pending=o}
window.pickRelic=(id,name)=>{if(!run.relics.includes(id))run.relics.push(id);if(id==='bell'){run.pressure=Math.max(0,run.pressure-20)}mark(window._pending);closeM();sync();toast('取得：'+name)};
function eventChoice(o){let bonus=run.relics.includes('lamp')?2:1;panel(`<h2>共鳴異象</h2><p>石壁後傳出與你腳步完全同步的回聲。你可以冒險沿聲音挖掘，或封住裂口降低不穩。</p><div class="choices"><button onclick="resolveEvent('dig')"><b>沿聲挖掘</b>獲得 ${bonus} 份戰利，但 +12% 不穩定。</button><button onclick="resolveEvent('seal')"><b>封住裂口</b>降低 10% 不穩定，放棄可能的寶物。</button></div>`);window._pending=o}
window.resolveEvent=kind=>{if(kind==='dig'){run.loot+=run.relics.includes('lamp')?2:1;run.pressure=Math.min(100,run.pressure+12)}else run.pressure=Math.max(0,run.pressure-10);mark(window._pending);closeM();sync()};
function hazard(o){let dmg=run.relics.includes('lamp')?14:9;run.pressure=Math.min(100,run.pressure+dmg);run.loot=Math.max(0,run.loot-1);mark(o);panel(`<h2>裂鳴區崩塌</h2><p>你踩破一層空洞岩殼。沒有生命值扣到零這種單純懲罰；代價是時間與攜帶物。</p><div class="card">不穩定 +${dmg}%<br>掉落 1 份未固定戰利</div><button onclick="closeM()">繼續</button>`)}
function extract(){let success=run.mapFound;let kept=run.loot;if(success){META.maps++;META.knowledge+=kept;META.bestDepth=Math.max(META.bestDepth,run.depth);saveMeta()}panel(`<h2>${success?'成功撤離':'主動撤退'}</h2><p>${success?'殘圖已固定進永久世界狀態。':'沒有找到核心測繪資料，但撤退本身不是失敗。'}</p><div class="card"><strong>本次種子：${run.seed}</strong><br>帶回戰利：${kept}<br>永久殘圖：${META.maps}</div><button class="primary" onclick="restart()">下一次遠征</button><button onclick="closeM()">留在入口</button>`)}
window.restart=()=>{closeM();newRun(((Date.now()+Math.floor(Math.random()*9999))%100000)|0)};
function collapse(){panel(`<h2>晶洞失穩</h2><p>共鳴達到 100%。你被迫丟棄未固定戰利，沿緊急繩索撤回入口。</p><div class="card">永久地圖知識不會消失。攜帶戰利歸零。</div><button class="primary" onclick="restart()">重新整備</button>`)}
function bag(){panel(`<h2>遠征行囊</h2><p>種子 <b>${run.seed}</b> 可以重現相同配置，方便測試與分享。</p><div class="card"><strong>攜帶戰利：${run.loot}</strong><br>測繪片：${run.mapFound?'已取得・尚未固定':'尚未取得'}<br>永久殘圖：${META.maps}<br>永久知識：${META.knowledge}</div><h3>目前遺物</h3><p>${run.relics.length?run.relics.map(relicName).join('、'):'無'}</p><button onclick="closeM()">關閉</button>`) }
function relicName(id){return({bridge:'折疊橋板',phase:'鳴晶相位釘',lamp:'蛾火燈',bell:'裂鳴鐘'})[id]||id}
function sync(){$('seed').textContent=String(run.seed).slice(-4);$('maps').textContent=META.maps;$('loot').textContent=run.loot;$('pressureBar').style.width=run.pressure+'%';$('pressureText').textContent='共鳴不穩定 '+run.pressure+'%';$('relics').textContent='遺物：'+(run.relics.length?run.relics.map(relicName).join(' / '):'無');$('goal').innerHTML='<b>目標</b><br>'+(run.mapFound?'把測繪片帶回綠色出口':'找到深處的黃色測繪匣')}
function panel(h){$('panel').innerHTML=h;$('modal').classList.add('show')}window.closeM=()=>$('modal').classList.remove('show');function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),1300)}
function tile(t,sx,sy,x,y){if(t==='wall'){X.fillStyle='#171b19';X.fillRect(sx,sy,T,T);X.fillStyle='#252a25';X.fillRect(sx+2,sy+2,T-4,7);if((x+y)%3===0){X.fillStyle='#334038';X.fillRect(sx+5,sy+13,9,4)}}else{X.fillStyle='#3b3830';X.fillRect(sx,sy,T,T);X.fillStyle='#514a3d';X.fillRect(sx+1,sy+1,T-2,2);X.fillStyle='#2b2a27';X.fillRect(sx+((x*11)%20)+3,sy+((y*7)%18)+5,5,2)}}
function obj(o,sx,sy){if(o.t==='exit'){X.fillStyle='#4da77e';X.fillRect(sx+5,sy+4,T-10,T-8);X.fillStyle='#102019';X.fillRect(sx+10,sy+10,T-20,T-10)}else if(o.t==='cache'){X.fillStyle='#e6c568';X.fillRect(sx+5,sy+9,T-10,13);X.fillStyle='#8d642d';X.fillRect(sx+7,sy+6,T-14,6)}else if(o.t==='event'){X.strokeStyle='#76d4ce';X.lineWidth=3;X.beginPath();X.arc(sx+T/2,sy+T/2,7,0,Math.PI*2);X.stroke()}else if(o.t==='relic'){X.fillStyle='#a68ad4';X.beginPath();X.moveTo(sx+T/2,sy+4);X.lineTo(sx+T-6,sy+T/2);X.lineTo(sx+T/2,sy+T-4);X.lineTo(sx+6,sy+T/2);X.fill()}else if(o.t==='hazard'){X.fillStyle='#9f4f45';X.beginPath();X.moveTo(sx+3,sy+T-4);X.lineTo(sx+T/2,sy+4);X.lineTo(sx+T-3,sy+T-4);X.fill()}else if(o.t==='crystal'){X.fillStyle='#83cec1';X.beginPath();X.moveTo(sx+T/2,sy+2);X.lineTo(sx+T-7,sy+T-6);X.lineTo(sx+7,sy+T-6);X.fill()}}
function player(sx,sy){X.fillStyle='#d7b28a';X.fillRect(sx+9,sy+4,10,8);X.fillStyle='#3d6575';X.fillRect(sx+6,sy+11,16,11);X.fillStyle='#1c242a';X.fillRect(sx+8,sy+21,5,6);X.fillRect(sx+16,sy+21,5,6);X.fillStyle='#e6c966';X.fillRect(sx+13,sy+13,4,4)}
function draw(){cam.x=clamp(P.x*T-C.width/2+T/2,0,Math.max(0,M[0].length*T-C.width));cam.y=clamp(P.y*T-C.height/2+T/2,0,Math.max(0,M.length*T-C.height));X.clearRect(0,0,C.width,C.height);let x0=Math.floor(cam.x/T),y0=Math.floor(cam.y/T),x1=Math.min(M[0].length,x0+Math.ceil(C.width/T)+2),y1=Math.min(M.length,y0+Math.ceil(C.height/T)+2);for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++)tile(M[y][x],x*T-cam.x,y*T-cam.y,x,y);for(const o of O){let sx=o.x*T-cam.x,sy=o.y*T-cam.y;if(sx>-T&&sy>-T&&sx<C.width+T&&sy<C.height+T)obj(o,sx,sy)}player(P.x*T-cam.x,P.y*T-cam.y);requestAnimationFrame(draw)}
function resize(){let r=C.parentElement.getBoundingClientRect();C.width=Math.floor(r.width);C.height=Math.floor(r.height);X.imageSmoothingEnabled=false}function dir(d){let v={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]}[d];move(...v)}document.querySelectorAll('[data-d]').forEach(b=>{let d=b.dataset.d,start=e=>{e.preventDefault();dir(d);clearInterval(timer);timer=setInterval(()=>dir(d),130)},stop=()=>clearInterval(timer);b.onpointerdown=start;b.onpointerup=stop;b.onpointercancel=stop;b.onpointerleave=stop});$('act').onclick=action;$('interact').onclick=action;$('bag').onclick=bag;document.addEventListener('keydown',e=>{if($('modal').classList.contains('show')){if(e.key==='Escape')closeM();return}let k=e.key.toLowerCase();if(k==='w'||k==='arrowup')dir('u');else if(k==='s'||k==='arrowdown')dir('d');else if(k==='a'||k==='arrowleft')dir('l');else if(k==='d'||k==='arrowright')dir('r');else if(['e','enter',' '].includes(k))action();else if(k==='b')bag()});window.onresize=resize;resize();newRun();check();draw();
})();
</script></body></html>
