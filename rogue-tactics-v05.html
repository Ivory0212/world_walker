106px;display:flex;justify-content:space-between;align-items:end;padding:8px 12px calc(8px + env(safe-area-inset-bottom));pointer-events:none}.pad,.buttons{width:108px;height:88px;position:relative;pointer-events:auto}.pad button,.buttons button,.actionbar button{position:absolute;border:1px solid #607772;background:#071719e8;color:#eee9d7;font-weight:900;box-shadow:0 4px 12px #0009}.pad button{width:39px;height:36px;border-radius:10px}.pad .u{left:34px;top:0}.pad .d{left:34px;bottom:0}.pad .l{left:0;top:26px}.pad .r{right:0;top:26px}.buttons .a{width:52px;height:52px;border-radius:50%;right:0;top:0;border-color:#8cbd9d}.buttons .b{width:48px;height:34px;border-radius:9px;left:0;bottom:2px}.prompt{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);z-index:8;display:none;border:1px solid #d8be72;border-radius:12px;padding:10px 14px;background:linear-gradient(#efd477,#c8aa52);color:#162021;font-weight:900;white-space:nowrap}.prompt.show{display:block}.relics{position:absolute;z-index:5;right:9px;bottom:112px;max-width:54%;background:#071113df;border:1px solid #63593d;border-radius:8px;padding:5px 7px;font-size:8px;color:#ddd6b7}.modal{position:absolute;inset:0;z-index:40;background:#010506df;display:none;align-items:center;justify-content:center;padding:14px}.modal.show{display:flex}.panel{width:min(94vw,560px);max-height:85vh;overflow:auto;background:linear-gradient(#10272a,#071719);border:1px solid #486166;border-radius:15px;padding:15px;box-shadow:0 18px 52px #000e}.panel h2{margin:0 0 6px}.panel p,.panel li{font-size:12px;color:#b7c8c2;line-height:1.55}.card{border:1px solid #465b57;border-radius:10px;padding:10px;margin:8px 0;background:#0b191a}.card strong{color:#e7c66a}.choices{display:grid;gap:8px}.panel button{position:static;width:100%;border:1px solid #506863;background:#173235;color:#f0ecdc;border-radius:10px;padding:10px;font-weight:800;text-align:left;margin-top:7px}.panel button.primary{background:linear-gradient(#efd477,#c7a84e);color:#172020}.panel button.danger{border-color:#92524b;color:#f0aaa1}.toast{position:absolute;z-index:60;left:50%;top:42%;transform:translate(-50%,-50%);opacity:0;background:#071416f5;border:1px solid #69887e;border-radius:11px;padding:9px 13px;font-weight:900;transition:.2s;white-space:nowrap}.toast.show{opacity:1;top:38%}#battle{background:#081518}.battleHead{height:66px;padding:8px 10px;display:flex;align-items:center;gap:8px;background:#0a1b1e;border-bottom:1px solid #2b454a}.battleHead .info b{display:block}.battleHead .info small{color:#94aaa4}.turn{margin-left:auto;border:1px solid #4e685f;border-radius:9px;padding:5px 8px;font-size:9px}.turn b{display:block;color:#e7c66a;font-size:14px}.battleField{position:absolute;left:0;right:0;top:66px;bottom:150px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#1b3030,#071214 72%);overflow:hidden}.grid{width:min(96vw,660px);aspect-ratio:9/6;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(6,1fr);border:1px solid #4b625f;box-shadow:0 20px 50px #0009}.cell{position:relative;border:1px solid #304844;background:#1b302d;display:grid;place-items:center}.cell:nth-child(odd){background:#172b29}.cell.rock{background:#313a36}.cell.water{background:#153d49}.cell.high{background:#394137}.cell.reach{box-shadow:inset 0 0 0 3px #e5c86399}.unit{width:70%;height:70%;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px;z-index:2;position:relative;box-shadow:0 4px 9px #0009}.unit.hero{background:linear-gradient(#d9f0d5,#6ea98b);color:#173027;border:2px solid #effbea}.unit.enemy{background:linear-gradient(#efaa94,#8d4b47);color:#321817;border:2px solid #ffd5ca}.unit.cache{border-radius:7px;background:linear-gradient(#e8ca69,#8f6d2d);color:#2c210b}.hp{position:absolute;left:5%;right:5%;bottom:-7px;height:4px;background:#391d1b;border-radius:2px;overflow:hidden}.hp i{display:block;height:100%;background:#b8e2b5}.battleUI{position:absolute;left:0;right:0;bottom:0;height:150px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#081719;border-top:1px solid #294448}.selected{height:25px;font-size:10px;color:#b5c7c0}.actionbar{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.actionbar button{position:static;padding:9px 5px;border-radius:9px}.actionbar .skill{border-color:#827346;color:#f0d57c}.log{font-size:9px;color:#8fa39d;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vfx{position:absolute;inset:0;pointer-events:none;z-index:12}.flash{position:absolute;width:12px;height:12px;border-radius:50%;background:#dffaff;box-shadow:0 0 14px 6px #8df2ff,0 0 30px 14px #5cd8ff66;animation:pop .55s ease-out forwards}.bolt{position:absolute;height:4px;transform-origin:0 50%;background:linear-gradient(90deg,#eaffff,#70e6ff,#a78aff);box-shadow:0 0 8px #7deeff;animation:bolt .45s ease-out forwards}@keyframes pop{to{transform:scale(5);opacity:0}}@keyframes bolt{0%{opacity:1}100%{opacity:0;filter:blur(3px)}}@media(min-width:800px){.app{max-width:1050px;margin:auto;border-left:1px solid #234;border-right:1px solid #234}.controls{opacity:.45}}</style></head><body><div class="app"><header class="top"><div class="logo">⌁</div><div><div class="title">霧界繪行者</div><div class="sub">v0.5 ・ Expedition → Tactics → World</div></div><div class="stats"><div class="stat">種子<b id="seed">—</b></div><div class="stat">永久圖<b id="metaMaps">0</b></div><div class="stat">捷徑<b id="shortcuts">0</b></div></div></header><main class="main"><section id="expedition" class="screen active"><canvas id="cave"></canvas><div class="hud"><div class="tag"><b>回音洞・變動層</b><br><span id="weather">晶鳴低潮</span></div><div class="tag"><b>遠征目標</b><br>奪回測繪核心並撤離</div></div><div class="bar"><i id="pressureFill"></i><span id="pressureText">共鳴不穩定 0%</span></div><button id="prompt" class="prompt">調查</button><div class="relics" id="relicText">遺物：無</div><div class="controls"><div class="pad"><button class="u" data-d="u">▲</button><button class="d" data-d="d">▼</button><button class="l" data-d="l">◀</button><button class="r" data-d="r">▶</button></div><div class="buttons"><button class="a" id="act">A</button><button class="b" id="bag">行囊</button></div></div></section><section id="battle" class="screen"><div class="battleHead"><button id="battleRetreat" style="border:1px solid #4c6460;background:#153034;color:#eee9d7;border-radius:9px;padding:7px 9px">撤離</button><div class="info"><b>裂鳴伏擊</b><small id="battleRule">環境規則：高地攻擊 +1</small></div><div class="turn">回合<b id="turnNo">1</b></div></div><div class="battleField"><div class="grid" id="grid"></div><div class="vfx" id="vfx"></div></div><div class="battleUI"><div class="selected" id="selected">點英雄，再選擇移動或攻擊。</div><div class="actionbar"><button id="move">移動</button><button id="attack">攻擊</button><button id="skill" class="skill">裂鳴技</button><button id="end">結束回合</button></div><div class="log" id="log">敵人守著測繪核心。可以殲滅，也可以搶核心撤退。</div></div></section><div class="modal" id="modal"><div class="panel" id="panel"></div></div><div class="toast" id="toast"></div></main></div><script>(()=>{'use strict';const $=id=>document.getElementById(id),T=28,C=$('cave'),X=C.getContext('2d');X.imageSmoothingEnabled=false;let META=JSON.parse(localStorage.getItem('mw05meta')||'null')||{maps:0,shortcuts:0,relics:[],runs:0};let run,M,O,P,near,timer,cam={x:0,y:0},battle=null;const save=()=>localStorage.setItem('mw05meta',JSON.stringify(META)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),1300)}function panel(h){$('panel').innerHTML=h;$('modal').classList.add('show')}window.closeM=()=>$('modal').classList.remove('show');function screen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}function newRun(seed=(Date.now()%100000)|0){let R=rng(seed),mods=['晶鳴低潮','地下水上升','風孔逆流'];run={seed,R,pressure:0,steps:0,core:false,loot:[],relics:[],events:{},modifier:mods[Math.floor(R()*mods.length)],battleWon:false};generate();P={x:3,y:8};META.runs++;save();sync();toast('遠征種子 '+seed)}function carveRect(x,y,w,h){for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)if(M[yy]&&M[yy][xx]!==undefined)M[yy][xx]='floor'}function generate(){const W=46,H=26,R=run.R;M=Array.from({length:H},()=>Array(W).fill('wall'));O=[];let rooms=[],x=2,y=5;for(let i=0;i<7;i++){let w=5+Math.floor(R()*4),h=5+Math.floor(R()*3);if(x+w>42){x=4;y+=8}if(y+h>23)break;rooms.push({x,y,w,h,i});carveRect(x,y,w,h);if(i){let a=rooms[i-1],ax=(a.x+a.w/2)|0,ay=(a.y+a.h/2)|0,bx=(x+w/2)|0,by=(y+h/2)|0;while(ax!==bx){M[ay][ax]='floor';ax+=Math.sign(bx-ax)}while(ay!==by){M[ay][ax]='floor';ay+=Math.sign(by-ay)}M[ay][ax]='floor'}x+=w+3+Math.floor(R()*3)}let first=rooms[0],last=rooms.at(-1);O.push({t:'exit',x:first.x+1,y:first.y+2,a:'extract',n:'遠征出口'});O.push({t:'battle',x:last.x+last.w-2,y:last.y+2,a:'battle',n:'測繪核心守衛'});rooms.slice(1,-1).forEach((r,i)=>{let px=r.x+1+Math.floor(R()*(r.w-2)),py=r.y+1+Math.floor(R()*(r.h-2)),roll=R();if(roll<.38)O.push({t:'relic',x:px,y:py,a:'relic',id:'r'+i,n:'失落遺物台'});else if(roll<.7)O.push({t:'event',x:px,y:py,a:'event',id:'e'+i,n:'地形異象'});else O.push({t:'hazard',x:px,y:py,a:'hazard',id:'h'+i,n:'共鳴裂區'})});if(run.modifier==='地下水上升')for(let yy=1;yy<H-1;yy++)for(let xx=1;xx<W-1;xx++)if(M[yy][xx]==='floor'&&R()<.07)M[yy][xx]='water';if(run.modifier==='風孔逆流')O.push({t:'vent',x:rooms[Math.min(2,rooms.length-1)].x+2,y:rooms[Math.min(2,rooms.length-1)].y+2,s:1})}function walk(x,y){if(!M[y])return false;let t=M[y][x];if(t==='wall')return false;if(t==='water'&&!run.relics.includes('tide'))return false;if(O.some(o=>o.s&&o.x===x&&o.y===y)&&!run.relics.includes('phase'))return false;return true}function moveP(dx,dy){let nx=P.x+dx,ny=P.y+dy;if(walk(nx,ny)){P.x=nx;P.y=ny;run.steps++;run.pressure=Math.min(100,run.pressure+1+(run.steps%8===0?2:0));if(run.pressure>=100)return collapse();check();sync()}}function check(){near=null;for(const o of O)if(o.a&&Math.abs(o.x-P.x)+Math.abs(o.y-P.y)<=1&&!run.events[o.id||o.a+o.x+','+o.y]){near=o;break}$('prompt').classList.toggle('show',!!near);$('prompt').textContent=near?'調查・'+near.n:'調查'}function mark(o){run.events[o.id||o.a+o.x+','+o.y]=1;near=null;check()}function action(){if(!near)return toast('附近沒有可調查物');let o=near;if(o.a==='extract')return extract();if(o.a==='battle')return startBattle(o);if(o.a==='relic')return relic(o);if(o.a==='event')return event(o);if(o.a==='hazard')return hazard(o)}function relic(o){let pool=[['bridge','折疊橋板','戰棋可在一個水格建立臨時橋。'],['phase','鳴晶相位釘','可穿越晶障；裂鳴技更靈活。'],['tide','潮汐鐘','本次遠征可走積水，戰棋水格成本降低。'],['lamp','蛾火燈','事件選項增加，但伏擊敵人 +1。']];let a=pool[Math.floor(run.R()*pool.length)],b=pool[Math.floor(run.R()*pool.length)];while(b[0]===a[0])b=pool[Math.floor(run.R()*pool.length)];window._pending=o;panel(`<h2>失落遺物台</h2><p>選的不是稀有度，而是接下來怎麼玩。</p><div class="choices"><button onclick="pick('${a[0]}','${a[1]}')"><strong>${a[1]}</strong><br>${a[2]}</button><button onclick="pick('${b[0]}','${b[1]}')"><strong>${b[1]}</strong><br>${b[2]}</button></div>`)}window.pick=(id,name)=>{run.relics.push(id);run.loot.push(name);mark(window._pending);closeM();sync();toast('取得 '+name)};function event(o){let extra=run.relics.includes('lamp')?'<button onclick="eventPick(2)"><strong>照亮側壁暗門</strong><br>+6% 壓力，獲得秘密撤離情報。</button>':'';window._pending=o;panel(`<h2>地形異象</h2><p>石壁後方傳出規律金屬敲擊。</p><button onclick="eventPick(0)"><strong>繞過</strong><br>安全。</button><button onclick="eventPick(1)"><strong>貼壁測繪</strong><br>+10% 壓力，降低戰鬥增援。</button>${extra}`)}window.eventPick=n=>{if(n===1){run.pressure+=10;run.scouted=true}else if(n===2){run.pressure+=6;run.secretExit=true}mark(window._pending);closeM();sync();toast(n?'情報已記錄':'選擇繞過')};function hazard(o){run.pressure=Math.min(100,run.pressure+14);mark(o);toast('穿越裂鳴區：+14%')}function extract(){if(!run.core){panel('<h2>現在撤離？</h2><p>你還沒有取得測繪核心。</p><button class="danger" onclick="finish(false)">撤離</button><button onclick="closeM()">繼續深入</button>');return}panel(`<h2>遠征成功</h2><p>測繪核心、遺物與路線情報全部帶回地表。</p><div class="card"><strong>永久影響</strong><br>+1 世界殘圖${run.secretExit?'<br>+1 地下捷徑':''}</div><button class="primary" onclick="finish(true)">返回世界</button>`)}window.finish=ok=>{if(ok){META.maps++;if(run.secretExit)META.shortcuts++;for(const r of run.relics)if(!META.relics.includes(r))META.relics.push(r);save()}closeM();newRun()};function collapse(){panel('<h2>洞層崩解</h2><p>共鳴達到臨界，本次攜帶物失去。</p><button class="danger" onclick="finish(false)">回到前哨</button>')}function startBattle(o){window._battleObj=o;screen('battle');battle={turn:1,phase:'hero',mode:'move',selected:null,core:false,units:[{name:'燕',team:'hero',x:0,y:1,hp:7,max:7,move:3,atk:2},{name:'磐',team:'hero',x:0,y:4,hp:10,max:10,move:2,atk:2},{name:'裂鳴兵',team:'enemy',x:6,y:1,hp:5,max:5,move:2,atk:2},{name:'弩手',team:'enemy',x:7,y:4,hp:4,max:4,move:2,atk:2}],cache:{x:8,y:2,active:true}};if(!run.scouted)battle.units.push({name:'增援',team:'enemy',x:8,y:5,hp:4,max:4,move:2,atk:2});if(run.relics.includes('lamp'))battle.units.push({name:'追光獸',team:'enemy',x:7,y:0,hp:3,max:3,move:3,atk:2});renderBattle();toast('進入戰棋伏擊')}const BW=9,BH=6,rocks=new Set(['3,1','3,2','5,4']),waters=new Set(['2,4','4,0','4,1']),highs=new Set(['5,1','6,1']);function K(x,y){return x+','+y}function man(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y)}function occ(x,y,except){return battle.units.some(u=>u!==except&&u.hp>0&&u.x===x&&u.y===y)||(battle.cache.active&&battle.cache.x===x&&battle.cache.y===y)}function reach(u){let s=new Set;for(let y=0;y<BH;y++)for(let x=0;x<BW;x++){if(rocks.has(K(x,y))||occ(x,y,u))continue;let cost=man(u,{x,y});if(waters.has(K(x,y))&&!run.relics.includes('tide'))cost++;if(cost<=u.move)s.add(K(x,y))}return s}function renderBattle(){let g=$('grid');g.innerHTML='';let rr=battle.selected&&battle.mode==='move'?reach(battle.selected):new Set;for(let y=0;y<BH;y++)for(let x=0;x<BW;x++){let c=document.createElement('div');c.className='cell';if(rocks.has(K(x,y)))c.classList.add('rock');if(waters.has(K(x,y)))c.classList.add('water');if(highs.has(K(x,y)))c.classList.add('high');if(rr.has(K(x,y)))c.classList.add('reach');let u=battle.units.find(q=>q.hp>0&&q.x===x&&q.y===y);if(u){let d=document.createElement('div');d.className='unit '+u.team;d.textContent=u.name[0];d.innerHTML+=`<span class="hp"><i style="width:${u.hp/u.max*100}%"></i></span>`;c.appendChild(d)}else if(battle.cache.active&&battle.cache.x===x&&battle.cache.y===y){let d=document.createElement('div');d.className='unit cache';d.textContent='核';c.appendChild(d)}c.onclick=()=>tapCell(x,y);g.appendChild(c)}$('turnNo').textContent=battle.turn;$('selected').textContent=battle.selected?`${battle.selected.name}｜HP ${battle.selected.hp}/${battle.selected.max}｜${battle.mode}`:(battle.core?'已取得測繪核心：可以撤退':'點英雄，再選擇移動或攻擊。');$('battleRule').textContent='環境：高地攻擊 +1'+(run.relics.includes('tide')?'｜潮汐鐘生效':'')}function tapCell(x,y){if(battle.phase!=='hero')return;let u=battle.units.find(q=>q.hp>0&&q.x===x&&q.y===y);if(u&&u.team==='hero'){battle.selected=u;return renderBattle()}if(!battle.selected)return;if(battle.mode==='move'&&reach(battle.selected).has(K(x,y))){battle.selected.x=x;battle.selected.y=y;if(battle.cache.active&&man(battle.selected,battle.cache)<=1){battle.cache.active=false;battle.core=true;log('奪取測繪核心！現在可以撤退。');vfxAt(x,y)}return renderBattle()}if(battle.mode==='attack'&&u&&u.team==='enemy'&&man(battle.selected,u)<=1)return hit(battle.selected,u,false);if(battle.mode==='skill'&&u&&u.team==='enemy'&&man(battle.selected,u)<=3)return hit(battle.selected,u,true)}function hit(a,t,skill){let dmg=a.atk+(highs.has(K(a.x,a.y))?1:0)+(skill?1:0);t.hp-=dmg;log(`${a.name}${skill?'施放裂鳴技':'攻擊'} ${t.name}：${dmg}`);vfxLine(a.x,a.y,t.x,t.y);if(!battle.units.some(u=>u.team==='enemy'&&u.hp>0)){bat
