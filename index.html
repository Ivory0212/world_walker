</style></head><body><div class="app"><header class="top"><div class="logo">⌁</div><div class="title">霧界繪行者</div><div class="stats"><div class="stat">補給<b id="supply">8</b></div><div class="stat">殘圖<b id="frags">0</b></div><div class="stat">發現<b id="found">1</b></div></div></header><main class="stage"><canvas id="game"></canvas><div class="hint">直接在世界裡行走。洞窟、地堡、遺跡與隧道是藏在地形中的空間，不是關卡按鈕。</div><div class="area" id="area">霧港島・南岸<small>地表 / 晴</small></div><div class="quest"><b>當前線索</b><span id="quest">沿舊路往北，找山壁上的「回音洞」。</span></div><button class="interact" id="interact">調查</button><div class="controls"><div class="pad"><button class="u" data-d="u">▲</button><button class="d" data-d="d">▼</button><button class="l" data-d="l">◀</button><button class="r" data-d="r">▶</button></div><div class="buttons"><button class="a" id="act">A</button><button class="m" id="map">殘圖</button></div></div><div class="modal" id="modal"><div class="panel" id="panel"></div></div><div class="toast" id="toast"></div><div class="fade" id="fade"></div></main></div><script>
