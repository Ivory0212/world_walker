<!doctype html>

<head>
<meta charset="utf-8" />

<title>霧界繪行者：失圖之海 v0.3</title>
<style>
:root{--ink:#071216;--panel:#0c2024;--line:#2d4b4e;--gold:#e9c66b;--cream:#f3eed7;--mint:#9bd3b8;--danger:#e67f6d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04090a;color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.app{height:100dvh;display:flex;flex-direction:column;background:#071216}.hud{height:60px;min-height:60px;display:flex;align-items:center;gap:10px;padding:8px 10px calc(8px + env(safe-area-inset-top));background:linear-gradient(#0a1d20,#071416);border-bottom:1px solid #274145;z-index:5}.brand{font-weight:900;letter-spacing:.1em;font-size:15px}.sigil{width:34px;height:34px;border-radius:50%;border:1px solid #8a7750;display:grid;place-items:center;color:var(--gold);box-shadow:inset 0 0 15px #e9c66b22}.chips{margin-left:auto;display:flex;gap:6px}.chip{min-width:48px;border:1px solid #314d51;background:#0c2023;border-radius:10px;padding:4px 7px;text-align:center;font-size:9px;color:#9db3ad}.chip b{display:block;font-size:15px;color:var(--gold)}.stage{position:relative;flex:1;min-height:0;overflow:hidden}.gameWrap{position:absolute;inset:0;background:#0d2a34}.gameWrap canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}.hint{position:absolute;left:10px;right:10px;top:10px;padding:8px 10px;background:#061012d9;border:1px solid #36565a;border-radius:10px;font-size:11px;color:#c2d0cb;z-index:3;pointer-events:none;box-shadow:0 6px 20px #0008}.areaTag{position:absolute;left:12px;top:54px;z-index:3;background:#0a1719cc;border-left:3px solid var(--gold);padding:7px 10px;font-weight:900;font-size:14px;box-shadow:0 4px 16px #0008}.areaTag small{display:block;color:#a8b9b4;font-size:9px;font-weight:600;margin-top:1px}.quest{position:absolute;right:10px;top:54px;max-width:46%;z-index:3;background:#0a1719d9;border:1px solid #3b5152;border-radius:10px;padding:7px 9px;font-size:10px;color:#cbd8d2;box-shadow:0 4px 16px #0008}.quest b{color:var(--gold);display:block;margin-bottom:2px}.interact{position:absolute;left:50%;bottom:108px;transform:translateX(-50%);z-index:5;border:1px solid #bca25c;background:linear-gradient(#f0d27b,#c7a650);color:#172023;border-radius:13px;padding:11px 18px;font-weight:900;display:none;box-shadow:0 7px 24px #0009}.interact.show{display:block}.controls{position:absolute;left:0;right:0;bottom:0;height:105px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:end;justify-content:space-between;pointer-events:none;z-index:4}.dpad{width:104px;height:88px;position:relative;pointer-events:auto}.dpad button,.actBtns button{position:absolute;border:1px solid #61736f;background:#0a1b1de6;color:#edf1e5;border-radius:12px;font-weight:900;box-shadow:0 4px 12px #0007}.dpad button:active,.actBtns button:active{background:#284443}.dpad .up{width:40px;height:38px;left:32px;top:0}.dpad .down{width:40px;height:38px;left:32px;bottom:0}.dpad .left{width:40px;height:38px;left:0;top:25px}.dpad .right{width:40px;height:38px;right:0;top:25px}.actBtns{width:112px;height:88px;position:relative;pointer-events:auto}.actBtns .a{width:52px;height:52px;right:2px;top:4px;border-radius:50%;background:#1e3732e6;border-color:#8fbd9f}.actBtns .map{width:48px;height:34px;left:0;bottom:3px;font-size:11px}.modal{position:absolute;inset:0;background:#010708dd;z-index:20;display:none;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.panel{width:min(92vw,520px);max-height:84vh;overflow:auto;background:linear-gradient(#10282b,#09181a);border:1px solid #466166;border-radius:16px;padding:16px;box-shadow:0 18px 50px #000d}.panel h2{margin:0 0 5px;font-size:22px}.panel p{color:#abc0ba;font-size:12px;line-height:1.55}.panel .gold{color:var(--gold)}.panel button{border:1px solid #486265;background:#173134;color:#f2f0de;border-radius:11px;padding:10px 12px;font-weight:800;margin-top:8px}.panel .primary{background:linear-gradient(#efd076,#c9a752);color:#18201f;border-color:#e8ce82}.fragmentCard{border:1px dashed #927b48;background:#201d13;padding:12px;border-radius:12px;margin-top:10px}.fragmentCard b{color:var(--gold)}.toast{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);background:#071416ef;border:1px solid #6d8d81;border-radius:12px;padding:10px 14px;font-weight:900;z-index:30;opacity:0;transition:.22s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;top:38%}.fade{position:absolute;inset:0;background:#000;z-index:25;opacity:0;pointer-events:none;transition:.3s}.fade.on{opacity:1}.desktopHelp{display:none}@media(min-width:800px){.app{max-width:1100px;margin:auto;border-left:1px solid #233b3f;border-right:1px solid #233b3f}.controls{opacity:.35}.desktopHelp{display:block;position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:10px;color:#c9d1cb88;z-index:2}}
</style>

<body>
<div class="app">
<header class="hud"><div class="sigil">⌁</div><div class="brand">霧界繪行者</div><div class="chips"><div class="chip">補給<b id="supply">8</b></div><div class="chip">殘圖<b id="frag">0</b></div><div class="chip">探索<b id="discover">1</b></div></div></header>
<div class="stage">
  <div class="gameWrap"><canvas id="game" width="960" height="640"></canvas></div>
  <div class="hint" id="hint">不是選關卡。你正在世界裡行走；洞窟、地堡、斷橋與海窟都直接藏在地形中。</div>
  <div class="areaTag" id="areaTag">霧港島・南岸<small>地表 / 晴</small></div>
  <div class="quest"><b>當前線索</b><span id="questText">沿著林間舊路往北，找到山壁上的「回音洞」。</span></div>
  <button class="interact" id="interact">調查</button>
  <div class="controls"><div class="dpad"><button class="up" data-dir="up">▲</button><button class="down" data-dir="down">▼</button><button class="left" data-dir="left">◀</button><button class="right" data-dir="right">▶</button></div><div class="actBtns"><button class="a" id="act">A</button><button class="map" id="mapBtn">殘圖</button></div></div>
  <div class="desktopHelp">鍵盤 WASD / 方向鍵移動・E/Enter 調查・M 查看殘圖</div><div class="modal" id="modal"><div class="panel" id="panel"></div></div><div class="toast" id="toast"></div><div class="fade" id="fade"></div>
</div></div></div>
<script>
(()=>{"use strict";
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;const TILE=32,W=64,H=48;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const COLORS={water:'#2b78a0',water2:'#4da2bb',sand:'#e6c47e',grass:'#78b75e',grass2:'#4d8e49',rock:'#6a675d',tree:'#2f7139',road:'#b59a65',river:'#4b99b2',fog:'#d5ded6'};
let state=JSON.parse(localStorage.getItem('mistwalker-v03')||'null')||{scene:'world',px:14,py:38,supply:8,fragments:0,discoveries:1,gotCaveFragment:false,revealedEast:false,quest:0};const save=()=>localStorage.setItem('mistwalker-v03',JSON.stringify(state));let scene='world',map=[],objects=[],player={x:state.px,y:state.py,dir:'up'},cam={x:0,y:0},nearObj=null,moveTimer=null;
function noise(x,y){let n=Math.sin(x*12.9898+y*78.233)*43758.5453;return n-Math.floor(n)}
function makeWorld(){map=Array.from({length:H},()=>Array(W).fill('water'));objects=[];for(let y=4;y<45;y++)for(let x=3;x<58;x++){let nx=(x-29)/27,ny=(y-25)/20,d=nx*nx+ny*ny+(noise(x,y)-.5)*.12;if(d<1)map[y][x]=d>.78?'sand':'grass'}for(let y=21;y<31;y++)for(let x=32;x<44;x++){let d=((x-38)/7)**2+((y-26)/5)**2;if(d<1)map[y][x]='river'}for(let y=10;y<20;y++)for(let x=11;x<20;x++){let d=((x-15.5)/5.3)**2+((y-15)/4.3)**2;if(d<1)map[y][x]='river'}for(let y=18;y<37;y++){let x=38+Math.round(Math.sin(y*.7)*2);for(let dx=-1;dx<=1;dx++)if(map[y]?.[x+dx]&&map[y][x+dx]!=='water')map[y][x+dx]='river'}let roadPts=[[14,39],[15,35],[17,31],[20,28],[24,26],[27,22],[29,18],[30,14]];for(let i=0;i<roadPts.length-1;i++){let[a,b]=roadPts[i],[c,d]=roadPts[i+1],steps=Math.max(Math.abs(c-a),Math.abs(d-b))*3;for(let s=0;s<=steps;s++){let x=Math.round(a+(c-a)*s/steps),y=Math.round(b+(d-b)*s/steps);if(map[y]?.[x]&&map[y][x]!=='water'&&map[y][x]!=='river')map[y][x]='road'}}for(let y=8;y<20;y++)for(let x=24;x<37;x++){let ridge=Math.abs(x-(30+Math.sin(y*.8)*2));if(ridge<5.5&&noise(x,y)>.22&&map[y][x]!=='water')map[y][x]='rock'}let forests=[[19,25,7],[27,30,6],[46,17,7],[48,31,6],[10,26,5],[21,13,5]];forests.forEach(([cx,cy,r])=>{for(let y=cy-r;y<=cy+r;y++)for(let x=cx-r;x<=cx+r;x++)if(map[y]?.[x]==='grass'&&((x-cx)**2+(y-cy)**2<r*r)&&noise(x*2,y*2)>.35)objects.push({type:'tree',x,y,solid:true})});objects.push({type:'village',x:14,y:39,solid:false,name:'霧港前哨'},{type:'cave',x:30,y:15,solid:false,name:'回音洞',action:'enterCave'},{type:'bunker',x:49,y:22,solid:false,name:'鏽門地堡',action:'lockedBunker'},{type:'tower',x:45,y:10,solid:false,name:'斷訊瞭望塔',action:'tower'},{type:'bridge',x:38,y:34,solid:false,name:'舊木橋'},{type:'ruin',x:52,y:34,solid:false,name:'潮痕石陣',action:'ruin'},{type:'boat',x:10,y:42,solid:false,name:'擱淺繪界船'})}
function makeCave(){scene='cave';map=Array.from({length:26},()=>Array(34).fill('void'));objects=[];for(let y=3;y<23;y++)for(let x=3;x<31;x++){let edge=x<5||x>28||y<5||y>20;if(!edge||noise(x,y)>.45)map[y][x]='cavefloor'}for(let y=6;y<19;y++)for(let x=5;x<14;x++)map[y][x]='cavefloor';for(let y=13;y<17;y++)for(let x=12;x<26;x++)map[y][x]='cavefloor';for(let y=7;y<16;y++)for(let x=23;x<29;x++)map[y][x]='cavefloor';objects.push({type:'exit',x:6,y:18,solid:false,name:'洞口',action:'exitCave'},{type:'crystal',x:18,y:14,solid:false,name:'鳴石晶簇',action:'crystal'},{type:'chest',x:27,y:9,solid:false,name:'失落測繪箱',action:'chest'},{type:'pillar',x:13,y:8,solid:true},{type:'pillar',x:24,y:17,solid:true});player.x=7;player.y=18;player.dir='up';document.getElementById('areaTag').innerHTML='回音洞・上層<small>洞窟 / 潮濕</small>';document.getElementById('questText').textContent='深入洞窟，找到失落測繪箱。';toast('進入支線：回音洞')}
function returnWorld(){scene='world';makeWorld();player.x=30;player.y=16;player.dir='down';document.getElementById('areaTag').innerHTML='霧港島・北脊<small>地表 / 晴</small>';document.getElementById('questText').textContent=state.gotCaveFragment?'帶著殘圖回到視野開闊處，解析東側迷霧。':'沿著林間舊路往北，找到山壁上的「回音洞」。';toast('回到霧港島')}
function isWalkable(x,y){if(y<0||x<0||y>=map.length||x>=map[0].length)return false;let t=map[y][x];if(scene==='world'&&(t==='water'||t==='rock'||t==='river'))return false;if(scene==='cave'&&t==='void')return false;if(objects.some(o=>o.solid&&o.x===x&&o.y===y))return false;return true}
function tryMove(dx,dy){player.dir=dx>0?'right':dx<0?'left':dy>0?'down':'up';let nx=player.x+dx,ny=player.y+dy;if(isWalkable(nx,ny)){player.x=nx;player.y=ny;if(scene==='world'){state.px=nx;state.py=ny;save()}}checkNear()}
function checkNear(){nearObj=null;let dirs=[[0,0],[1,0],[-1,0],[0,1],[0,-1]];for(const o of objects)if(dirs.some(([dx,dy])=>player.x+dx===o.x&&player.y+dy===o.y)&&o.action){nearObj=o;break}document.getElementById('interact').classList.toggle('show',!!nearObj);document.getElementById('interact').textContent=nearObj?'調查・'+nearObj.name:'調查'}
function interact(){if(!nearObj){toast('附近沒有可調查的東西');return}switch(nearObj.action){case'enterCave':transition(makeCave);break;case'exitCave':transition(returnWorld);break;case'lockedBunker':openPanel('<h2>鏽門地堡</h2><p>厚重防爆門沒有電力，但門側仍留著一個六角形權限槽。</p><div class="fragmentCard"><b>需要：</b> 軍用權限印記<br><small>這不是等級限制，而是世界探索條件。某條支線應該藏著對應物。</small></div><button onclick="closeModal()">離開</button>');break;case'tower':openPanel('<h2>斷訊瞭望塔</h2><p>從塔頂能看見東側迷霧後方有海岸線與巨大的石環輪廓。</p><p class="gold">提示：只看得到輪廓，不代表能直接前往。真正的路需要地圖情報。</p><button onclick="closeModal()">記住這個方向</button>');break;case'ruin':openPanel('<h2>潮痕石陣</h2><p>石環中央刻著退潮刻度。現在還缺少「潮汐鐘」才能讓這裡發生變化。</p><button onclick="closeModal()">離開</button>');break;case'crystal':toast('晶簇發出低鳴，東側牆後似乎有空洞');break;case'chest':if(!state.gotCaveFragment){state.gotCaveFragment=true;state.fragments++;state.quest=1;save();document.getElementById('frag').textContent=state.fragments;openPanel('<h2>取得：海岸殘圖</h2><p>測繪箱裡不是武器，而是一張被撕去右半部的舊海圖。</p><div class="fragmentCard"><b>「潮痕海岸・西側測繪片」</b><br>墨線指向島的東側。某片原本不存在於記憶中的海岸，也許能被重新拼回世界。</div><button class="primary" onclick="closeModal()">收下殘圖</button>');document.getElementById('questText').textContent='帶著殘圖離開洞窟，回到地表解析。'}else toast('測繪箱已經空了');break}}
function transition(fn){let f=document.getElementById('fade');f.classList.add('on');setTimeout(()=>{fn();checkNear();f.classList.remove('on')},320)}function openPanel(html){document.getElementById('panel').innerHTML=html;document.getElementById('modal').classList.add('show')}window.closeModal=()=>document.getElementById('modal').classList.remove('show');
function openFragments(){if(state.fragments<=0){openPanel('<h2>殘圖袋</h2><p>目前沒有可解析的殘圖。深入洞窟、地堡、遺跡或擊敗攜圖敵人，都可能取得新的世界情報。</p><button onclick="closeModal()">關閉</button>');return}let extra=state.revealedEast?'<p class="gold">東側海岸已經被重新繪回世界。</p>':'<button class="primary" onclick="revealEast()">解析「潮痕海岸」</button>';openPanel('<h2>殘圖袋</h2><div class="fragmentCard"><b>潮痕海岸・西側測繪片</b><br>可消耗 1 張殘圖，讓東側迷霧退去，揭露新的可探索區域。</div>'+extra+'<button onclick="closeModal()">稍後再決定</button>')}
window.revealEast=()=>{if(state.fragments<1||state.revealedEast)return;state.fragments--;state.revealedEast=true;state.discoveries++;save();document.getElementById('frag').textContent=state.fragments;document.getElementById('discover').textContent=state.discoveries;closeModal();toast('世界恢復：東側潮痕海岸');document.getElementById('questText').textContent='前往東側新出現的海岸，尋找潮痕石陣與地堡入口。'};
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('show'),1500)}
function drawTile(t,sx,sy,x,y){if(t==='water'){ctx.fillStyle=COLORS.water;ctx.fillRect(sx,sy,TILE,TILE);ctx.fillStyle=COLORS.water2;let o=(performance.now()/180+y*7+x*11)%24;ctx.fillRect(sx+((x*13+o)%24),sy+7,7,2);ctx.fillRect(sx+((x*7+o*1.4)%20),sy+20,10,2)}else if(t==='sand'){ctx.fillStyle=COLORS.sand;ctx.fillRect(sx,sy,TILE,TILE);ctx.fillStyle='#d9ad63';ctx.fillRect(sx+5+(x*7%18),sy+8+(y*5%13),2,2)}else if(t==='grass'||t==='road'){ctx.fillStyle=t==='grass'?COLORS.grass:COLORS.road;ctx.fillRect(sx,sy,TILE,TILE);if(t==='grass'){ctx.fillStyle=COLORS.grass2;ctx.fillRect(sx+(x*9%27),sy+(y*13%25),2,5);ctx.fillRect(sx+((x*5+y*3)%28),sy+((y*7+x)%25),2,3)}else{ctx.fillStyle='#8f774e';ctx.fillRect(sx+((x*3)%24),sy+((y*5)%24),3,2)}}else if(t==='river'){ctx.fillStyle=COLORS.river;ctx.fillRect(sx,sy,TILE,TILE);ctx.fillStyle='#76c0ce';ctx.fillRect(sx+4,sy+10,14,2);ctx.fillRect(sx+15,sy+23,12,2)}else if(t==='rock'){ctx.fillStyle='#4e5b4e';ctx.fillRect(sx,sy,TILE,TILE);ctx.fillStyle='#8c8979';ctx.beginPath();ctx.moveTo(sx+3,sy+28);ctx.lineTo(sx+15,sy+5);ctx.lineTo(sx+29,sy+28);ctx.fill();ctx.fillStyle='#c0bba8';ctx.beginPath();ctx.moveTo(sx+11,sy+12);ctx.lineTo(sx+15,sy+5);ctx.lineTo(sx+20,sy+13);ctx.fill()}else if(t==='cavefloor'){ctx.fillStyle='#3b3731';ctx.fillRect(sx,sy,TILE,TILE);ctx.fillStyle='#514b42';ctx.fillRect(sx+2,sy+2,27,2);ctx.fillRect(sx+((x*11)%25),sy+((y*7)%25),5,3)}else{ctx.fillStyle='#151918';ctx.fillRect(sx,sy,TILE,TILE)}}
function drawObj(o,sx,sy){if(o.type==='tree'){ctx.fillStyle='#513d2d';ctx.fillRect(sx+13,sy+17,7,14);ctx.fillStyle='#1d562c';ctx.fillRect(sx+4,sy+5,25,18);ctx.fillStyle='#4e9a48';ctx.fillRect(sx+8,sy+1,17,18);ctx.fillStyle='#79bd58';ctx.fillRect(sx+11,sy+3,8,7)}else if(o.type==='cave'){ctx.fillStyle='#4f554f';ctx.beginPath();ctx.arc(sx+16,sy+17,15,Math.PI,0);ctx.fill();ctx.fillRect(sx+1,sy+17,30,14);ctx.fillStyle='#111617';ctx.beginPath();ctx.arc(sx+16,sy+21,8,Math.PI,0);ctx.fill();ctx.fillRect(sx+8,sy+20,16,11);ctx.fillStyle='#b89b5c';ctx.fillRect(sx+14,sy+28,4,2)}else if(o.type==='village'){ctx.fillStyle='#d0aa68';ctx.fillRect(sx+7,sy+13,20,16);ctx.fillStyle='#724b37';ctx.beginPath();ctx.moveTo(sx+4,sy+14);ctx.lineTo(sx+17,sy+2);ctx.lineTo(sx+30,sy+14);ctx.fill();ctx.fillStyle='#34271f';ctx.fillRect(sx+14,sy+20,6,9)}else if(o.type==='bunker'){ctx.fillStyle='#5a625e';ctx.fillRect(sx+3,sy+9,27,20);ctx.fillStyle='#252c2b';ctx.fillRect(sx+11,sy+14,12,15);ctx.fillStyle='#b45540';ctx.fillRect(sx+25,sy+14,3,3)}else if(o.type==='tower'){ctx.fillStyle='#6d6555';ctx.fillRect(sx+10,sy+4,13,25);ctx.fillStyle='#3a3330';ctx.fillRect(sx+6,sy+2,21,6);ctx.fillStyle='#d7b65e';ctx.fillRect(sx+14,sy+10,5,5)}else if(o.type==='ruin'){ctx.strokeStyle='#c1b78d';ctx.lineWidth=4;ctx.beginPath();ctx.arc(sx+16,sy+16,11,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#887d60';ctx.fillRect(sx+14,sy+3,4,10)}else if(o.type==='boat'){ctx.fillStyle='#eee4ce';ctx.beginPath();ctx.moveTo(sx+2,sy+19);ctx.lineTo(sx+28,sy+19);ctx.lineTo(sx+23,sy+27);ctx.lineTo(sx+8,sy+27);ctx.fill();ctx.fillStyle='#5c4634';ctx.fillRect(sx+14,sy+4,2,15);ctx.fillStyle='#d2c4a6';ctx.beginPath();ctx.moveTo(sx+16,sy+5);ctx.lineTo(sx+26,sy+14);ctx.lineTo(sx+16,sy+14);ctx.fill()}else if(o.type==='chest'){ctx.fillStyle='#b8893c';ctx.fillRect(sx+7,sy+12,20,15);ctx.fillStyle='#e0bc61';ctx.fillRect(sx+8,sy+9,18,6);ctx.fillStyle='#2a2018';ctx.fillRect(sx+15,sy+14,4,6)}else if(o.type==='crystal'){ctx.fillStyle='#9fe4db';ctx.beginPath();ctx.moveTo(sx+16,sy+2);ctx.lineTo(sx+24,sy+18);ctx.lineTo(sx+17,sy+29);ctx.lineTo(sx+8,sy+18);ctx.fill();ctx.fillStyle='#d7fff3';ctx.fillRect(sx+14,sy+6,3,9)}else if(o.type==='exit'){ctx.fillStyle='#111';ctx.fillRect(sx+5,sy+8,22,22);ctx.strokeStyle='#6a5e4d';ctx.strokeRect(sx+5,sy+8,22,22)}else if(o.type==='pillar'){ctx.fillStyle='#716a5b';ctx.fillRect(sx+10,sy+5,12,25)}}
function drawPlayer(sx,sy){ctx.fillStyle='#1c2631';ctx.fillRect(sx+9,sy+8,14,18);ctx.fillStyle='#d7b28a';ctx.fillRect(sx+11,sy+3,10,9);ctx.fillStyle='#405f7d';ctx.fillRect(sx+8,sy+14,16,9);ctx.fillStyle='#e6c966';ctx.fillRect(sx+14,sy+13,4,4);ctx.fillStyle='#171a1d';ctx.fillRect(sx+9,sy+25,5,6);ctx.fillRect(sx+19,sy+25,5,6);ctx.fillStyle='#fff';ctx.fillRect(sx+13,sy+7,2,2);ctx.fillRect(sx+18,sy+7,2,2)}
function drawFog(){if(scene!=='world'||state.revealedEast)return;ctx.save();ctx.globalAlpha=.92;for(let y=0;y<map.length;y++)for(let x=43;x<map[0].length;x++){let sx=x*TILE-cam.x,sy=y*TILE-cam.y;if(sx>-TILE&&sy>-TILE&&sx<canvas.width&&sy<canvas.height){ctx.fillStyle=COLORS.fog;ctx.fillRect(sx,sy,TILE+1,TILE+1);ctx.fillStyle='#b8c7be';ctx.fillRect(sx+((x*9+y)%22),sy+((x+y*5)%22),12,4)}}ctx.restore()}
function render(){let vw=canvas.width,vh=canvas.height;cam.x=clamp(player.x*TILE-vw/2+TILE/2,0,map[0].length*TILE-vw);cam.y=clamp(player.y*TILE-vh/2+TILE/2,0,map.length*TILE-vh);ctx.clearRect(0,0,vw,vh);let x0=Math.floor(cam.x/TILE),y0=Math.floor(cam.y/TILE),x1=Math.min(map[0].length,x0+Math.ceil(vw/TILE)+2),y1=Math.min(map.length,y0+Math.ceil(vh/TILE)+2);for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++)drawTile(map[y][x],x*TILE-cam.x,y*TILE-cam.y,x,y);for(const o of objects){let sx=o.x*TILE-cam.x,sy=o.y*TILE-cam.y;if(sx>-40&&sy>-40&&sx<vw+40&&sy<vh+40)drawObj(o,sx,sy)}drawPlayer(player.x*TILE-cam.x,player.y*TILE-cam.y);drawFog();requestAnimationFrame(render)}
function resize(){let rect=canvas.parentElement.getBoundingClientRect();canvas.width=Math.floor(rect.width);canvas.height=Math.floor(rect.height);ctx.imageSmoothingEnabled=false}function moveDir(dir){let d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[dir];if(d)tryMove(...d)}document.querySelectorAll('[data-dir]').forEach(b=>{let dir=b.dataset.dir,start=e=>{e.preventDefault();moveDir(dir);clearInterval(moveTimer);moveTimer=setInterval(()=>moveDir(dir),130)},stop=()=>clearInterval(moveTimer);b.addEventListener('pointerdown',start);b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);b.addEventListener('pointerleave',stop)});document.getElementById('act').onclick=interact;document.getElementById('interact').onclick=interact;document.getElementById('mapBtn').onclick=openFragments;document.addEventListener('keydown',e=>{if(document.getElementById('modal').classList.contains('show')){if(e.key==='Escape')closeModal();return}let k=e.key.toLowerCase();if(['arrowup','w'].includes(k))moveDir('up');else if(['arrowdown','s'].includes(k))moveDir('down');else if(['arrowleft','a'].includes(k))moveDir('left');else if(['arrowright','d'].includes(k))moveDir('right');else if(['e','enter',' '].includes(k))interact();else if(k==='m')openFragments()});
function init(){makeWorld();player.x=state.px;player.y=state.py;document.getElementById('supply').textContent=state.supply;document.getElementById('frag').textContent=state.fragments;document.getElementById('discover').textContent=state.discoveries;document.getElementById('questText').textContent=state.gotCaveFragment?(state.revealedEast?'前往東側新出現的海岸，尋找潮痕石陣與地堡入口。':'帶著殘圖回到視野開闊處，解析東側迷霧。'):'沿著林間舊路往北，找到山壁上的「回音洞」。';checkNear();render()}window.addEventListener('resize',resize);resize();init();
})();
